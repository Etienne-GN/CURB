[workspace]
resolver = "2"
members = ["proto", "curbd", "cli"]
# "bpf" and "gui" are added in later phases (P1/P3 eBPF, GUI frontend).

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["Etienne-GN"]
repository = "https://github.com/Etienne-GN/CURB"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures = "0.3"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
lto = "thin"
